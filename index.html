<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Calculatrice-Odin</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <title>Calculatrice-Odin</title>

</head>
<body>
     
    <h3>Calculatrice-Odin</h3>

    <div class="calculatrice">
        <p class="infos"></p>
        <form action="" name="form">
            <div class="resultat">
                <input type="text" id="fenetre" name="fenetre">
            </div>
           
            <div class="boutons">
                <input type="button" value="1"  onclick="addToFenetre('1')">
                <input type="button" value="2"  onclick="addToFenetre('2')">
                <input type="button" value="3"  onclick="addToFenetre('3')">
                <input type="button" value="+" onclick="addToFenetre('+')">
                <br>
                <input type="button" value="4" onclick="addToFenetre('4')">
                <input type="button" value="5" onclick="addToFenetre('5')">
                <input type="button" value="6" onclick="addToFenetre('6')">
                <input type="button" value="-" onclick="addToFenetre('-')">
                <br>
                <input type="button" value="7" onclick="addToFenetre('7')">
                <input type="button" value="8" onclick="addToFenetre('8')">
                <input type="button" value="9" onclick="addToFenetre('9')">
                <input type="button" value="*" onclick="addToFenetre('*')">
                <br>
                <input type="button" value="0" onclick="addToFenetre('0')">
                <input type="button" value="." onclick="addToFenetre('.')">
                <input type="button" value="effacer"  onclick="clearFenetre()">
                <input type="button" value="/" onclick="addToFenetre('/')">
                <br>
                <input type="button" value="=" class="boutton" onclick="calculer()">
            </div>

        </form>
    </div>
    
     <script src="script.js"></script>
</body>
</html>
