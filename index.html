<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Calculatrice-Odin</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <title>Calculatrice-Odin</title>

</head>
<body>
     
    <h3>Calculatrice-Odin</h3>

    <div class="calculatrice">
        <p class="infos"></p>
        <form action="" name="form">
            <div class="resultat">
                <input type="text" id="fenetre" name="fenetre">
            </div>
           
            <div class="boutons">
                <div class="rang">
                   <input type="button" value="1" name="b1"  onclick="val(b1.value)">
                <input type="button" value="2" name="b2"  onclick="val(b2.value)">
                <input type="button" value="3" name="b3"  onclick="val(b3.value)">
                <input type="button" value="+" name="add" onclick="val(add.value)"> 
                </div>

                <div class="rang">
                    <input type="button" value="4" name="b4" onclick="val(b4.value)">
                <input type="button" value="5" name="b5" onclick="val(b5.value)">
                <input type="button" value="6" name="b6" onclick="val(b6.value)">
                <input type="button" value="-" name="sub" onclick="val(sub.value)">
                </div>

                <div class="rang">
                    <input type="button" value="7" name="b7" onclick="val(b7.value)">
                <input type="button" value="8" name="b8" onclick="val(b8.value)">
                <input type="button" value="9" name="b9" onclick="val(b9.value)">
                <input type="button" value="*" name="mul" onclick="val(mul.value)">
                </div>

                <div class="rang">
                <input type="button" value="0" name="b0" onclick="val(b0.value)">
                <input type="button" value="." name="dot" onclick="val(dot.value)">
                
                <input type="button" value="/" name="div" onclick="val(div.value)">
                <input type="button" value="=" name="egale" onclick="calculer()">
                </div>
                
                <input type="button" class="clear" value="effacer" name="clear"  onclick="clear()">
            </div>

        </form>
    </div>
    
     <script src="script.js"></script>
</body>
</html>
