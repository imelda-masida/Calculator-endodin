<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice-Odin</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <title>Calculatrice-Odin</title>

</head>
<body>
     
    <h3>Calculatrice-Odin</h3>

    <div class="calculatrice">
        <p class="infos"></p>
        <form action="" name="form">
            <div class="resultat">
                <input type="text" id="fenetre" name="fenetre">
            </div>
           
            <div class="boutons">
                
                <input type="button" value="1" name="b1"  onclick="addfenetre('1')">
                <input type="button" value="2" name="b2"  onclick="addfenetre('2')">
                <input type="button" value="3" name="b3"  onclick="addfenetre('3')">
                <input type="button" value="+" name="add" onclick="addfenetre('+')"> 
                <br>
                
                <input type="button" value="4" name="b4" onclick="addfenetre('4')">
                <input type="button" value="5" name="b5" onclick="addfenetre('5')">
                <input type="button" value="6" name="b6" onclick="addfenetre('6')">
                <input type="button" value="-" name="sub" onclick="addfenetre('-')">
                <br>
                
                <input type="button" value="7" name="b7" onclick="addfenetre('7')">
                <input type="button" value="8" name="b8" onclick="addfenetre('8')">
                <input type="button" value="9" name="b9" onclick="addfenetre('9')">
                <input type="button" value="*" name="mul" onclick="addfenetre('*')">
                <br>
                
                <input type="button" value="0" name="b0" onclick="addfenetre('0')">
                <input type="button" value="." name="dot" onclick="addfenetre('.')">
                
                <input type="button" value="/" name="div" onclick="addfenetre('/')">
                <input type="button" value="=" name="egale" onclick="calculer()">
                <br>
                
                <input type="button" class="clear" value="effacer" name="clear"  onclick="clear()">
            </div>

        </form>
    </div>
    
     
</body>
</html>
